model:
  vocab_size: 276
  max_seq_len: 256
  hidden_dim: 512
  num_heads: 8
  encoder_layers: 4
  decoder_layers: 8
  ffn_dim: 2048
  dropout: 0.1
  num_semantic_tokens: 32
  encoder_layer_split: null
  decoder_sees_prompt: false
  tie_embeddings: true
bottleneck:
  noise_std: 0.05
  use_noise_train: true
  use_queries: true
core:
  type: global_mlp
  num_layers: 6
  num_heads: 8
  ffn_dim: 2048
  dropout: 0.1
  mlp_hidden: 2048
  mlp_depth: 8
  mlp_activation: gelu
  conv_kernel: 3
  conv_dilation: 1
  ssm_d_state: 16
  ssm_d_conv: 4
  ssm_expand: 2.0
  hopfield_beta: 1.0
  hopfield_steps: 20
  bi_detach_state: true
  diffusion_steps: 4
  diffusion_schedule: cosine
  seed: 1234
vae:
  enabled: true
  beta: 0.01
  kl_warmup_steps: 200
  free_bits: 0.05
  logvar_clamp: 10.0
  active_unit_threshold: 0.01
loss:
  paraphrase_weight: 0.5
  variance_weight: 1.0
  covariance_weight: 1.0
  variance_target: 1.0
  latent_weight: 1.0
  latent_cosine_weight: 0.5
  decode_weight: 1.0
data:
  raw_dir: data/raw
  processed_dir: data/processed
  cache_dir: data/cache
  metadata_path: data/metadata.json
  max_seq_len: 256
  val_split: 0.04
  test_split: 0.04
  seed: 42
  hf_dataset: roskoN/dailydialog
  tokenizer_type: bpe
  bpe_vocab_size: 16000
train:
  device: auto
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  epochs: 50
  max_steps: null
  warmup_steps: 500
  grad_accum: 4
  grad_clip: 1.0
  val_interval: 1000
  patience: null
  amp: auto
  num_workers: 0
  seed: 3407
  save_epoch_checkpoints: true
  pin_memory: auto
  log_dir: logs
  checkpoint_dir: checkpoints
  samples_dir: samples
  log_interval: 50
  preview_prompts:
  - The weather today is good, I want to go hiking.
  - Alice picked up the book and asked me to read it aloud.
  - Is the most important thing about AI its ability to understand natural language?
  - A book dropped from the table.
  - I like music beacause it makes me feel happy and relaxed.
gen:
  max_gen_len: 2048
  temperature: 0.7
  top_p: 0.9
  greedy: true
eval:
  data_preset: english
  custom_tests_file: null
  intervention_prompt_a: null
  intervention_prompt_b: null
  probe_subjects: null
  probe_objects: null
